<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>Speed Building Test — Missing Number Series (Reasoning)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --green: #10b981;
            --green-light: #ecfdf5;
            --red: #ef4444;
            --red-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100dvh;
            font-size: 15px;
            line-height: 1.5;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }
        .hidden { display: none !important; }

        /* START / MODE SELECTION */
        .start-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .start-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .brand-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px;
        }
        .start-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .start-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            text-align: left;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .mode-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }
        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .mode-icon.quiz { background: #dbeafe; color: #2563eb; }
        .mode-icon.test { background: #d1fae5; color: #059669; }
        .mode-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .mode-info-txt { font-size: 12px; color: var(--text-muted); }
        .mode-arrow { margin-left: auto; color: var(--text-muted); font-size: 14px; }

        /* QUIZ APP */
        .quiz-app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .quiz-header {
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hdr-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }
        .hdr-timer {
            padding: 6px 14px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
        }
        .hdr-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* QUESTIONS */
        .quiz-main {
            flex: 1;
            overflow-y: auto;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .q-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .q-num-badge {
            padding: 5px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .lang-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            background: #fff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .q-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 22px;
            white-space: pre-line;
        }
        .opts {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .opt:hover:not(.locked) {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .opt.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .opt.correct {
            border-color: var(--green);
            background: var(--green-light);
        }
        .opt.wrong {
            border-color: var(--red);
            background: var(--red-light);
        }
        .opt.locked { cursor: default; }
        .opt-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .opt.selected .opt-letter { background: var(--primary); color: #fff; border-color: var(--primary); }
        .opt.correct .opt-letter { background: var(--green); color: #fff; border-color: var(--green); }
        .opt.wrong .opt-letter { background: var(--red); color: #fff; border-color: var(--red); }
        .opt-text { flex: 1; font-weight: 600; }
        .opt-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .opt.correct .opt-tag { background: var(--green); color: #fff; }
        .opt.wrong .opt-tag { background: var(--red); color: #fff; }

        .sol-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
        }
        .sol-head {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* BOTTOM NAV */
        .quiz-nav {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-btn.prev { background: #fff; border: 1px solid var(--border-color); }
        .nav-btn.prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.submit { background: var(--green-light); color: #065f46; border: 1px solid #a7f3d0; }
        .nav-btn.next { background: var(--primary); color: #fff; }

        /* PALETTE */
        .palette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
        .palette-overlay.open { display: block; }
        .palette-drawer {
            position: fixed; top: 0; left: 0; bottom: 0; width: min(340px, 85vw);
            background: #fff; z-index: 160; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.25s;
        }
        .palette-drawer.open { transform: translateX(0); }
        .pal-head {
            padding: 18px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; font-weight: 700;
        }
        .pal-grid {
            flex: 1; overflow-y: auto; padding: 16px;
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-content: start;
        }
        .pal-btn {
            aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border-color);
            background: #f8fafc; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .pal-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
        .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 170; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            width: 100%; max-width: 420px; background: #fff;
            border-radius: 20px; padding: 28px; text-align: center;
        }
        .modal-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 22px; }
        .modal-stat { background: #f8fafc; border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); }
        .modal-stat-num { font-size: 24px; font-weight: 800; }
        .modal-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn.cancel { background: #f1f5f9; }

        /* RESULTS */
        .results-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 180; display: none; overflow-y: auto; padding: 30px 16px 60px; }
        .results-screen.open { display: block; }
        .results-box { max-width: 600px; margin: 0 auto; text-align: center; }
        .res-score-card { background: #0f172a; color: #fff; border-radius: 20px; padding: 28px; margin: 20px 0; }
        .res-score-val { font-size: 54px; font-weight: 800; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .res-item { background: #fff; border-radius: 14px; padding: 16px; border: 1px solid var(--border-color); }
        .res-item-val { font-size: 22px; font-weight: 700; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
            background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 30px;
            font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: all 0.25s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <div class="brand-icon"><i class="fas fa-cubes"></i></div>
            <h1 class="start-title">Missing Number Series</h1>
            <p class="start-desc">SSC Reasoning — Speed Building Test</p>
            <button class="mode-btn" onclick="startApp('quiz')">
                <div class="mode-icon quiz"><i class="fas fa-bolt"></i></div>
                <div><div class="mode-name">Practice Mode</div><div class="mode-info-txt">Har question ke baad instant solution dekhein.</div></div>
            </button>
            <button class="mode-btn" onclick="startApp('test')">
                <div class="mode-icon test"><i class="fas fa-clock"></i></div>
                <div><div class="mode-name">Exam Mode</div><div class="mode-info-txt">Complete exam simulation score analysis ke saath.</div></div>
            </button>
        </div>
    </div>

    <div class="quiz-app hidden" id="quizApp">
        <header class="quiz-header">
            <div class="quiz-header-inner">
                <button class="hdr-btn" onclick="openPalette()"><i class="fas fa-th-large"></i></button>
                <div class="hdr-brand">Missing Number Series</div>
                <div class="hdr-timer"><i class="fas fa-stopwatch"></i> <span id="timerText">00:00</span></div>
            </div>
        </header>

        <main class="quiz-main" id="quizMain"></main>

        <nav class="quiz-nav" id="quizNav">
            <div class="quiz-nav-inner">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()"><i class="fas fa-arrow-left"></i> Previous</button>
                <button class="nav-btn submit" onclick="openSubmitModal()"><i class="fas fa-paper-plane"></i> Submit</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()"><span id="nextLabel">Next</span> <i class="fas fa-arrow-right"></i></button>
            </div>
        </nav>
    </div>

    <div class="palette-overlay" id="paletteOverlay" onclick="closePalette()"></div>
    <aside class="palette-drawer" id="paletteDrawer">
        <div class="pal-head"><span>Questions</span><button onclick="closePalette()"><i class="fas fa-times"></i></button></div>
        <div class="pal-grid" id="paletteGrid"></div>
    </aside>

    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3>Submit Test?</h3>
            <div class="modal-stats-grid">
                <div class="modal-stat"><div class="modal-stat-num" id="modalAttempted" style="color:var(--green)">0</div><div>Attempted</div></div>
                <div class="modal-stat"><div class="modal-stat-num" id="modalUnattempted" style="color:var(--text-muted)">0</div><div>Unattempted</div></div>
            </div>
            <button class="modal-btn confirm" onclick="confirmSubmit()">Yes, Finish</button>
            <button class="modal-btn cancel" onclick="closeSubmitModal()">Resume</button>
        </div>
    </div>

    <div class="results-screen" id="resultsScreen"><div class="results-box" id="resultsInner"></div></div>
    <div class="toast" id="toast"><span id="toastText"></span></div>

    <script>
        const QUESTIONS = [
            {
                e: "Find the next term in the given number series:\nSeries: 3, 4, 7, 11, 18, 29, ?",
                h: "दी गई संख्या क्रम में अगला पद ज्ञात कीजिए:\nक्रम : 3, 4, 7, 11, 18, 29, ?",
                oEn: ["56", "52", "45", "47"],
                oHi: ["56", "52", "45", "47"],
                a: 3,
                s: "Pattern: Each number is the sum of the two preceding numbers.<br>3 + 4 = 7<br>4 + 7 = 11<br>7 + 11 = 18<br>11 + 18 = 29<br>18 + 29 = 47."
            },
            {
                e: "Find the next term in the given number series:\nSeries: 2, 2, 4, 12, 48, ?",
                h: "दी गई संख्या श्रृंखला में अगला पद ज्ञात करें :\nश्रृंखला : 2, 2, 4, 12, 48, ?",
                oEn: ["150", "180", "200", "240"],
                oHi: ["150", "180", "200", "240"],
                a: 3,
                s: "Pattern:<br>2 × 1 = 2<br>2 × 2 = 4<br>4 × 3 = 12<br>12 × 4 = 48<br>48 × 5 = 240."
            },
            {
                e: "Which number will replace the question mark (?) in the following series?\n31, 37, 41, 43, ? , 53, 59, 61, 67",
                h: "31, 37, 41, 43, ? , 53, 59, 61, 67\nनिम्नलिखित श्रृंखला में प्रश्न चिन्ह (?) के स्थान पर कौन सी संख्या आएगी?",
                oEn: ["49", "45", "51", "47"],
                oHi: ["49", "45", "51", "47"],
                a: 3,
                s: "Series consists of consecutive prime numbers: 31, 37, 41, 43, 47, 53, 59, 61, 67.<br>Missing prime = 47."
            },
            {
                e: "Select the numbers from among the given options that can replace the question marks (?) in the following series.\n83, 86, 91, 98, ?, 122, ?",
                h: "83, 86, 91, 98, ?, 122, ?\nदिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["90, 171", "92, 173", "109, 139", "98, 189"],
                oHi: ["90, 171", "92, 173", "109, 139", "98, 189"],
                a: 2,
                s: "Pattern: Differences are consecutive prime numbers.<br>83 + 3 = 86<br>86 + 5 = 91<br>91 + 7 = 98<br>98 + 11 = 109<br>109 + 13 = 122<br>122 + 17 = 139.<br>Answer = 109, 139."
            },
            {
                e: "Select the numbers from among the given options that can replace the question marks (?) in the following series.\n1, 2, 4, ?, 11, ?, 22",
                h: "1, 2, 4, ?, 11, ?, 22\nदिए गए विकल्पों में से वह संख्या चुनिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["8, 20", "7, 16", "5, 17", "6, 18"],
                oHi: ["8, 20", "7, 16", "5, 17", "6, 18"],
                a: 1,
                s: "Pattern: +1, +2, +3, +4, +5, +6.<br>1 + 1 = 2<br>2 + 2 = 4<br>4 + 3 = 7<br>7 + 4 = 11<br>11 + 5 = 16<br>16 + 6 = 22.<br>Answer = 7, 16."
            },
            {
                e: "Select the number from among the given options that can replace the question mark (?) in the following series.\n4, 14, 34, 64, ?, 154",
                h: "4, 14, 34, 64, ?, 154\nदिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["94", "124", "104", "114"],
                oHi: ["94", "124", "104", "114"],
                a: 2,
                s: "Differences are multiples of 10 or difference of differences is +10.<br>14 - 4 = 10<br>34 - 14 = 20<br>64 - 34 = 30<br>Next diff = 40 => 64 + 40 = 104<br>154 - 104 = 50."
            },
            {
                e: "Select the numbers from among the given options that can replace the question marks (?) in the following series.\n6, 7, 16, 41, ?, ?, 292",
                h: "6, 7, 16, 41, ?, ?, 292\nदिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["90, 171", "95, 180", "100, 220", "115, 240"],
                oHi: ["90, 171", "95, 180", "100, 220", "115, 240"],
                a: 0,
                s: "Pattern: Differences are squares of integers.<br>7 - 6 = 1 = 1²<br>16 - 7 = 9 = 3²<br>41 - 16 = 25 = 5²<br>Next: 41 + 7² = 41 + 49 = 90<br>Next: 90 + 9² = 90 + 81 = 171<br>Check: 171 + 11² = 171 + 121 = 292."
            },
            {
                e: "Select the number from among the given options that can replace the question mark (?) in the following series.\n729, 512, 343, ?, 125",
                h: "729, 512, 343, ?, 125\nनिम्नलिखित श्रृंखला में प्रश्न चिह्न (?) के स्थान पर आने वाली संख्या को दिए गए विकल्पों में से चुनें।",
                oEn: ["16", "64", "576", "216"],
                oHi: ["16", "64", "576", "216"],
                a: 3,
                s: "Cubes of descending natural numbers:<br>9³ = 729<br>8³ = 512<br>7³ = 343<br>6³ = 216<br>5³ = 125."
            },
            {
                e: "Select the number from among the given options that can replace the question mark (?) in the following series.\n15, 20, 45, 170, ?",
                h: "15, 20, 45, 170, ?\nदिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["645", "795", "520", "840"],
                a: 1,
                s: "Pattern:<br>(15 × 1) + 5 = 20<br>(20 × 2) + 5 = 45<br>(45 × 3) + 35? Alternatively, differences: 5, 25 (5²), 125 (5³), next 625 (5⁴).<br>170 + 625 = 795."
            },
            {
                e: "Select the number from among the given options that can replace the question mark (?) in the following series.\n1, 3, 7, 15, 31, 63, ?",
                h: "1, 3, 7, 15, 31, 63, ?\nनिम्नलिखित श्रृंखला में प्रश्न चिह्न (?) के स्थान पर आने वाली संख्या को दिए गए विकल्पों में से चुनें।",
                oEn: ["125", "130", "127", "120"],
                oHi: ["125", "130", "127", "120"],
                a: 2,
                s: "Pattern: ×2 + 1<br>1 × 2 + 1 = 3<br>3 × 2 + 1 = 7<br>7 × 2 + 1 = 15<br>15 × 2 + 1 = 31<br>31 × 2 + 1 = 63<br>63 × 2 + 1 = 127."
            },
            {
                e: "Select the number from among the given options that can replace the question mark (?) in the following series.\n14, 158, 258, 322, ?, 374",
                h: "14, 158, 258, 322, ?, 374\nदिए गए विकल्पों में से वह संख्या चुनिए जो निम्नलिखित श्रृंखला में प्रश्नचिह्न (?) के स्थान पर आ सकती है।",
                oEn: ["355", "358", "353", "360"],
                oHi: ["355", "358", "353", "360"],
                a: 1,
                s: "Differences: 144, 100, 64, 36, 16 (consecutive even squares: 12², 10², 8², 6², 4²).<br>322 + 36 = 358<br>358 + 16 = 374."
            },
            {
                e: "Which of the following term will replace the question mark (?) in the given series\n7, 3, 6, 7, 5, 11, ?",
                h: "7, 3, 6, 7, 5, 11, ?\nदी गई श्रृंखला में प्रश्न चिह्न (?) के स्थान पर कौन-सा पद आएगा?",
                oEn: ["55", "44", "4", "22"],
                oHi: ["55", "44", "4", "22"],
                a: 2,
                s: "Alternate series:<br>Series 1: 7, 6, 5, ? => 7 - 1 = 6, 6 - 1 = 5, 5 - 1 = 4.<br>Series 2: 3, 7, 11 (+4 progression).<br>Next term belongs to Series 1 = 4."
            },
            {
                e: "Find the missing number.\n7, 21, 105, ?, 8085.",
                h: "7, 21, 105, ?, 8085.\nलुप्त संख्या ज्ञात कीजिए।",
                oEn: ["315", "525", "735", "945"],
                oHi: ["315", "525", "735", "945"],
                a: 2,
                s: "Pattern: Multiplication by consecutive odd numbers.<br>7 × 3 = 21<br>21 × 5 = 105<br>105 × 7 = 735<br>735 × 11 = 8085."
            },
            {
                e: "Find the next number.\n1, 6, 18, 40, 75, 126, ?",
                h: "अगली संख्या ज्ञात कीजिए।\n1, 6, 18, 40, 75, 126, ?",
                oEn: ["161", "182", "196", "204"],
                oHi: ["161", "182", "196", "204"],
                a: 2,
                s: "Difference 1: 5, 12, 22, 35, 51.<br>Difference 2: 7, 10, 13, 16 (gap of +3).<br>Next in Diff 2 = 19.<br>Next in Diff 1 = 51 + 19 = 70.<br>Next number = 126 + 70 = 196."
            },
            {
                e: "Identify the wrong number in the following series.\n1, 2, 6, 24, 121, 720",
                h: "1, 2, 6, 24, 121, 720\nनिम्नलिखित श्रृंखला में गलत संख्या की पहचान करें।",
                oEn: ["6", "24", "121", "720"],
                oHi: ["6", "24", "121", "720"],
                a: 2,
                s: "Factorial pattern: 1!, 2!, 3!, 4!, 5!, 6!<br>1 = 1<br>1 × 2 = 2<br>2 × 3 = 6<br>6 × 4 = 24<br>24 × 5 = 120 (given 121 is wrong).<br>120 × 6 = 720."
            },
            {
                e: "A series is given with one term missing. Select the correct alternative from the given ones that will complete the series.\n730, 736, 742, 748, 754, 760, ?, 772",
                h: "730, 736, 742, 748, 754, 760, ?, 772\nएक श्रृंखला दी गई है जिसमें एक पद लुप्त है। दिए गए विकल्पों में से वह सही विकल्प चुनें जो श्रृंखला को पूरा करेगा।",
                oEn: ["766", "762", "765", "763"],
                oHi: ["766", "762", "765", "763"],
                a: 0,
                s: "Constant difference of +6.<br>760 + 6 = 766<br>766 + 6 = 772."
            },
            {
                e: "A series is given with one term missing. Select the correct alternative from the given ones that will complete the series.\n87, 258, ?, 2310, 6927, 20778",
                h: "एक श्रृंखला दी गई है जिसमें एक पद लुप्त है। 87, 258, ?, 2310, 6927, 20778",
                oEn: ["774", "771", "773", "781"],
                oHi: ["774", "771", "773", "781"],
                a: 1,
                s: "Pattern: ×3 - 3<br>87 × 3 - 3 = 261 - 3 = 258<br>258 × 3 - 3 = 774 - 3 = 771<br>771 × 3 - 3 = 2313 - 3 = 2310."
            },
            {
                e: "A series is given with one term wrong. Select the wrong term from the given alternatives.\n-837, -833, -829, -824, -821, -817, -813, -809",
                h: "एक श्रृंखला दी गई है जिसमें एक पद गलत है। -837, -833, -829, -824, -821, -817, -813, -809",
                oEn: ["-824", "-813", "-837", "-817"],
                oHi: ["-824", "-813", "-837", "-817"],
                a: 0,
                s: "Pattern: Constant difference of +4.<br>-837 + 4 = -833<br>-833 + 4 = -829<br>-829 + 4 = -825 (given -824 is wrong).<br>-825 + 4 = -821."
            },
            {
                e: "A series is given with one term missing. Select the correct alternative from the given ones that will complete the series.\n200, 197, ?, 191, 188, 185, 182, 179",
                h: "200, 197, ?, 191, 188, 185, 182, 179\nएक श्रृंखला दी गई है जिसमें एक पद लुप्त है। सही विकल्प चुनिए।",
                oEn: ["195", "196", "194", "198"],
                oHi: ["195", "196", "194", "198"],
                a: 2,
                s: "Constant difference of -3.<br>200 - 3 = 197<br>197 - 3 = 194<br>194 - 3 = 191."
            }
        ];

        const state = {
            current: 0,
            answers: new Array(QUESTIONS.length).fill(null),
            locked: new Array(QUESTIONS.length).fill(false),
            visited: new Array(QUESTIONS.length).fill(false),
            mode: 'test',
            lang: 'en',
            startTime: null,
            timerInterval: null,
            elapsed: 0
        };

        function $(id) { return document.getElementById(id); }
        function toast(msg) {
            const t = $('toast'); $('toastText').textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
        function formatTime(s) {
            const m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }
        function startApp(mode) {
            state.mode = mode; $('startScreen').classList.add('hidden'); $('quizApp').classList.remove('hidden');
            state.startTime = Date.now(); state.visited[0] = true;
            state.timerInterval = setInterval(() => {
                state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                $('timerText').textContent = formatTime(state.elapsed);
            }, 1000);
            renderQuestion(); buildPalette();
        }
        function toggleLang() {
            state.lang = state.lang === 'en' ? 'hi' : 'en';
            renderQuestion();
        }
        function renderQuestion() {
            const i = state.current, q = QUESTIONS[i], isQuiz = state.mode === 'quiz', locked = state.locked[i], userAns = state.answers[i];
            const qTxt = state.lang === 'en' ? q.e : q.h;
            const opts = state.lang === 'en' ? q.oEn : q.oHi;
            let optsHtml = '';
            opts.forEach((opt, idx) => {
                let cls = '', tag = '';
                if (isQuiz && locked) {
                    if (idx === q.a) { cls = 'correct'; tag = '<span class="opt-tag">Correct</span>'; }
                    if (userAns === idx && idx !== q.a) { cls = 'wrong'; tag = '<span class="opt-tag">Your Ans</span>'; }
                } else if (userAns === idx) cls = 'selected';
                optsHtml += `<div class="opt ${cls} ${locked ? 'locked' : ''}" onclick="selectOption(${idx})"><div class="opt-letter">${String.fromCharCode(65 + idx)}</div><div class="opt-text">${opt}</div>${tag}</div>`;
            });
            let solHtml = (isQuiz && locked) ? `<div class="sol-box"><div class="sol-head"><i class="fas fa-lightbulb"></i> Solution &amp; Pattern</div><div>${q.s}</div></div>` : '';
            $('quizMain').innerHTML = `
                <div class="q-card">
                    <div class="q-top">
                        <div class="q-num-badge">Question ${i + 1} of ${QUESTIONS.length}</div>
                        <button class="lang-btn" onclick="toggleLang()"><i class="fas fa-language"></i> ${state.lang === 'en' ? 'हिन्दी' : 'English'}</button>
                    </div>
                    <div class="q-text">${qTxt}</div>
                    <div class="opts">${optsHtml}</div>
                    ${solHtml}
                </div>
            `;
            $('prevBtn').disabled = i === 0;
            $('nextLabel').textContent = i === QUESTIONS.length - 1 ? 'Finish' : 'Next';
            updatePaletteGrid();
        }
        function selectOption(idx) {
            if (state.mode === 'quiz' && state.locked[state.current]) return;
            state.answers[state.current] = idx;
            if (state.mode === 'quiz') {
                state.locked[state.current] = true;
                if (idx === QUESTIONS[state.current].a) toast('Correct! 🎉'); else toast('Incorrect');
            }
            renderQuestion();
        }
        function prevQuestion() { if (state.current > 0) { state.current--; renderQuestion(); } }
        function nextQuestion() {
            if (state.current < QUESTIONS.length - 1) { state.current++; state.visited[state.current] = true; renderQuestion(); }
            else openSubmitModal();
        }
        function buildPalette() {
            const grid = $('paletteGrid'); grid.innerHTML = '';
            QUESTIONS.forEach((_, i) => {
                const btn = document.createElement('button'); btn.className = 'pal-btn'; btn.id = 'pal-' + i; btn.textContent = i + 1;
                btn.onclick = () => { state.current = i; closePalette(); renderQuestion(); };
                grid.appendChild(btn);
            });
            updatePaletteGrid();
        }
        function updatePaletteGrid() {
            QUESTIONS.forEach((_, i) => {
                const btn = $('pal-' + i); if (!btn) return;
                btn.className = 'pal-btn';
                if (i === state.current) btn.classList.add('current');
                if (state.answers[i] !== null) btn.classList.add('answered');
            });
        }
        function openPalette() { $('paletteDrawer').classList.add('open');$('paletteOverlay').classList.add('open'); }
        function closePalette() { $('paletteDrawer').classList.remove('open');$('paletteOverlay').classList.remove('open'); }
        function openSubmitModal() {
            const ans = state.answers.filter(a => a !== null).length;
            $('modalAttempted').textContent = ans; $('modalUnattempted').textContent = QUESTIONS.length - ans;
            $('submitModal').classList.add('open');
        }
        function closeSubmitModal() { $('submitModal').classList.remove('open'); }
        function confirmSubmit() {
            closeSubmitModal(); if (state.timerInterval) clearInterval(state.timerInterval);
            let correct = 0, wrong = 0;
            state.answers.forEach((ans, i) => { if (ans !== null) { if (ans === QUESTIONS[i].a) correct++; else wrong++; } });
            $('resultsInner').innerHTML = `
                <h2>Test Completed!</h2><p style="color:var(--text-muted);margin:8px 0;">Total Time: ${formatTime(state.elapsed)}</p>
                <div class="res-score-card"><div class="res-score-val">${correct} / ${QUESTIONS.length}</div><div>Total Score</div></div>
                <div class="res-grid">
                    <div class="res-item"><div class="res-item-val" style="color:var(--green)">${correct}</div><div>Correct</div></div>
                    <div class="res-item"><div class="res-item-val" style="color:var(--red)">${wrong}</div><div>Wrong</div></div>
                </div>
                <button class="modal-btn confirm" onclick="location.reload()">Retake</button>
            `;
            $('resultsScreen').classList.add('open');
        }
    </script>
</body>
</html>
